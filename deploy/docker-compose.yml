version: '3.9'
services:
  caddy:
    container_name: caddy
    image: nochlezhka/mks-app:${MKS_VERSION}
    entrypoint: [ "/etc/caddy/entrypoint.sh" ]
    links:
      - php
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    restart: unless-stopped
    volumes:
      - "./storage/data/uploads:/var/www/symfony/public/uploads"
      - "./storage/data/caddy:/data"
    environment:
      - DOMAIN=${MKS_DOMAIN:-}
      - EMAIL=${MKS_SUPPORT_EMAIL:-}
      - MODE=${CADDY_MODE:-http}

  php:
    container_name: mks-app
    image: nochlezhka/mks-app:${MKS_VERSION}
    restart: unless-stopped
    volumes:
      - "./storage/data/uploads:/var/www/symfony/public/uploads"
    env_file:
      - .env

  db:
    container_name: db
    image: mysql:8.0.30
    profiles:
      - local
    cap_add:
      - SYS_NICE
    ports:
      - 3306:3306
    restart: unless-stopped
    volumes:
      - "./storage/mysql/data:/var/lib/mysql"
    env_file:
      - .env
